[package]
name = "sasha"
version = "0.2.0-b"
edition = "2024"
license = "GPL-3.0-only"

[dependencies]
chrono = "0.4"
gpui-kit = "0.9.1"
mlua = { version = "0.10", features = ["lua54", "vendored"] }
rust-i18n = "4"
serde = { version = "1", features = ["derive"] }
serialport = "4.10.1"
notify = "8"
regex = "1.13.1"
toml = "0.8"
ureq = "3"
serde_json = "1"
semver = "1"
sha2 = "0.10"
clap = { version = "4.6.8", features = ["derive"] }
ctrlc = "3.5.3"

[dev-dependencies]
gpui = { package = "gpui-pre", version = "=0.3.12", features = ["test-support"] }

[build-dependencies]
winresource = "0.1"

[patch.crates-io]
# Local fix: upstream accesskit_windows 0.34.0 panics (aborting the process) in
# client_top_left when a window is destroyed during a UIA query.
accesskit_windows = { path = "vendor/accesskit_windows" }
# Local patch: gpui-pre 0.3.12 plus a `WhiteSpace::BreakAnywhere` text wrap mode
# (long unbreakable tokens such as file paths fill each line instead of jumping
# whole to the next one). See vendor/gpui-pre/SASHA-PATCHES.md.
gpui-pre = { path = "vendor/gpui-pre" }
